name: Python wheels

# Builds binary wheels of the `prestige-uvs` distribution (import name `prestige`) with RocksDB bundled, so
# `pip install prestige-uvs` needs no compiler and no system RocksDB.
#
#   push of a tag v*        -> build, test, publish to PyPI (trusted publishing; see docs/python-bindings.md)
#   workflow_dispatch       -> build, test, publish to TestPyPI
#   pull_request / push     -> build and test only (artifacts kept 7 days)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest     # manylinux_2_28 x86_64
            linux_arch: x86_64
          - os: ubuntu-24.04-arm  # manylinux_2_28 aarch64
            linux_arch: aarch64
          - os: macos-13          # x86_64
          - os: macos-14          # arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install RocksDB (macOS)
        if: runner.os == 'macOS'
        run: brew install rocksdb openssl@3

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        with:
          package-dir: ./python
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686"
          CIBW_ARCHS_MACOS: native
          CIBW_ARCHS_LINUX: ${{ matrix.linux_arch }}
          # manylinux_2_28 (AlmaLinux 8) has RocksDB in EPEL; build it from source if the package is unavailable.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >
            (dnf install -y epel-release && dnf install -y rocksdb-devel openssl-devel) ||
            (dnf install -y openssl-devel snappy-devel lz4-devel libzstd-devel zlib-devel bzip2-devel gflags-devel &&
             git clone --depth 1 --branch v9.7.4 https://github.com/facebook/rocksdb.git /tmp/rocksdb &&
             cmake -S /tmp/rocksdb -B /tmp/rocksdb/build -DCMAKE_BUILD_TYPE=Release -DROCKSDB_BUILD_SHARED=ON
               -DWITH_GFLAGS=OFF -DWITH_TESTS=OFF -DWITH_BENCHMARK_TOOLS=OFF -DWITH_TOOLS=OFF -DWITH_SNAPPY=ON -DWITH_LZ4=ON -DWITH_ZSTD=ON -DWITH_ZLIB=ON -DWITH_BZ2=ON &&
             cmake --build /tmp/rocksdb/build -j"$(nproc)" && cmake --install /tmp/rocksdb/build)
          # The macOS runner's RocksDB bottle sets the minimum macOS version; the wheel tag must match for delocate.
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=$(otool -l $(brew --prefix rocksdb)/lib/librocksdb.dylib | awk '/minos/{print $2; exit}')
            OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -q --import-mode=importlib {project}/python/tests/test_store.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 7

  publish_pypi:
    name: publish to PyPI
    needs: build_wheels
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing: register this repo/workflow/environment as a publisher of prestige-uvs
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -lh dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish_testpypi:
    name: publish to TestPyPI
    needs: build_wheels
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
